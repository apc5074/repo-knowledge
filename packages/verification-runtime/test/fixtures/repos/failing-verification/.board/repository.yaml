version: 1
repository:
  name: failing-verification
  type: service
  primary_language: typescript
related_repositories: []
external_systems: []
known_limitations: []
verification:
  default:
    - id: fail
      command:
        command: node
        args:
          - -e
          - "console.error('failed'); process.exit(2)"
    - id: timeout
      command:
        command: node
        args:
          - -e
          - "setTimeout(() => {}, 2000)"
        timeout_seconds: 1
