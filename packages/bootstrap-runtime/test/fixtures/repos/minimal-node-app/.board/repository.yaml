version: 1
repository:
  name: minimal-node-app
  type: service
  primary_language: javascript
setup:
  install:
    command: node
    args:
      - scripts/setup.js
applications:
  api:
    id: api
    type: api
    working_directory: .
    dev:
      command: node
      args:
        - scripts/app.js
    health_check:
      command:
        command: node
        args:
          - scripts/health.js
